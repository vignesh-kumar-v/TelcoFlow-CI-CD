name: ML Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything that needs no trained model.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: make unit-test

  # The full pipeline, then the integration tests that assert on its output.
  pipeline:
    name: Pipeline and integration tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build features in SQL
        run: make sql-features

      - name: Train
        run: make train-quick

      - name: Batch score
        run: make score

      - name: Verify drift detection fires
        run: make score-drift

      - name: A/B test simulation
        run: make ab-test

      - name: Run all tests
        run: make test

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            artifacts/
            reports/
          retention-days: 14

      - name: Upload predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predictions-${{ github.run_number }}
          path: outputs/
          retention-days: 7

      - name: Summarise the run
        if: always()
        run: |
          echo "## Pipeline summary" >> $GITHUB_STEP_SUMMARY
          RUN_DIR=$(ls -d artifacts/*/ 2>/dev/null | sort -r | head -1)
          if [ -n "$RUN_DIR" ]; then
            echo "**Deployed model:** \`$(python -c "import json;print(json.load(open('${RUN_DIR}train_info.json'))['model_name'])")\`" >> $GITHUB_STEP_SUMMARY
            echo '### Model comparison' >> $GITHUB_STEP_SUMMARY
            echo '| Model | ROC-AUC | Precision | Recall | F1 |' >> $GITHUB_STEP_SUMMARY
            echo '|---|---|---|---|---|' >> $GITHUB_STEP_SUMMARY
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import glob, json
          run = sorted(glob.glob("artifacts/*/model_comparison.json"))[-1]
          for name, m in sorted(json.load(open(run)).items(), key=lambda kv: -kv[1]["roc_auc"]):
              print(f"| {name} | {m['roc_auc']:.4f} | {m['precision']:.3f} | {m['recall']:.3f} | {m['f1_score']:.3f} |")
          PY
          fi

  # Manifests and DAG structure, validated without a cluster or an Airflow install.
  manifests:
    name: Manifests and DAG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Kubernetes manifests and Airflow DAG
        run: python -m pytest tests/test_k8s_manifests.py tests/test_orchestration.py -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: telco-churn-mlops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
